name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_evals:
        description: "Run the AI quality evals (costs a little AI spend)"
        type: boolean
        default: false

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx tsc --noEmit -p .

  # Real assistants on golden cases; fails when a suite drops below evals/baseline.json.
  # Runs on manual dispatch, and on changes to agent prompts or models.
  evals:
    needs: backend
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_evals) ||
      (github.event_name == 'pull_request' && contains(join(github.event.pull_request.labels.*.name, ','), 'prompt-change'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m evals.run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: backend/evals/results/
